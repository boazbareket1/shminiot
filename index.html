<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מפגש</title>
<meta property="og:title" content="סדנת השמיניות">
<meta property="og:description" content="מעגל התבוננות, תודעה והתרחבות">
<meta property="og:image" content="https://boazbareket1.github.io/shminiot/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e6;
  --paper-2:#efe7d8;
  --ink:#3a3832;
  --ink-soft:#6b665b;
  --sea:#7fb5a6;
  --sea-deep:#4f8c7d;
  --rose:#d9a5a4;
  --rose-deep:#b87472;
  --sand:#d8b97e;
  --sand-deep:#a9894d;
  --card:rgba(255,252,245,.78);
  --line:rgba(58,56,50,.14);
  --shadow:0 10px 30px rgba(70,60,40,.12);
  --display:"Frank Ruhl Libre",serif;
  --body:"Rubik",system-ui,sans-serif;
  --zoom-ms:600ms;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-weight:300;
  line-height:1.65;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- Watercolor canvas ---------- */
.wc-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wash{
  position:absolute;border-radius:50%;
  filter:url(#wc-edge) blur(14px);
  mix-blend-mode:multiply;opacity:.55;
}
.wash.w1{width:62vmax;height:52vmax;top:-18vmax;right:-16vmax;background:radial-gradient(circle at 40% 45%,var(--sea) 0%,rgba(127,181,166,.35) 45%,transparent 70%)}
.wash.w2{width:56vmax;height:58vmax;bottom:-22vmax;left:-18vmax;background:radial-gradient(circle at 55% 50%,var(--rose) 0%,rgba(217,165,164,.35) 45%,transparent 70%)}
.wash.w3{width:44vmax;height:38vmax;top:38%;left:30%;background:radial-gradient(circle at 50% 50%,var(--sand) 0%,rgba(216,185,126,.25) 50%,transparent 72%);opacity:.38}
.wash.w4{width:30vmax;height:28vmax;top:8%;left:6%;background:radial-gradient(circle,var(--sand) 0%,transparent 68%);opacity:.3}
.wash.w5{width:34vmax;height:30vmax;bottom:4%;right:8%;background:radial-gradient(circle,var(--sea) 0%,transparent 68%);opacity:.3}
.grain{position:absolute;inset:0;filter:url(#wc-grain);opacity:.32;mix-blend-mode:multiply}

/* ---------- Layout ---------- */
.app{position:relative;z-index:1;overflow:hidden;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{transition:opacity .3s;display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);backdrop-filter:blur(6px);display:grid;place-items:center;
  transition:transform .2s, background .2s;
}
.icon-btn:hover{transform:scale(1.06);background:#fffaf0}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round}

.home{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 16px 28px;transition:opacity var(--zoom-ms) ease}
.home-head{text-align:center;max-width:640px;margin:2px auto 6px}
.home-head h1{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,4.2vw,2.7rem);margin:0;letter-spacing:.01em}
.home-head p{margin:2px 0 0;color:var(--ink-soft);font-size:clamp(.95rem,2.2vw,1.1rem)}

/* ---------- Flower ---------- */
.flower-wrap{width:min(100%,680px);flex:1;display:flex;align-items:center;justify-content:center}
.flower{
  position:relative;width:100%;aspect-ratio:1/1;max-height:calc(100dvh - 190px);
  transition:transform var(--zoom-ms) cubic-bezier(.6,.05,.25,1), opacity var(--zoom-ms) ease;
  transform-origin:50% 50%;
}
.flower.zoomed{opacity:0}
.petal,.hub{
  position:absolute;border:0;padding:0;background:none;border-radius:50%;
  display:grid;place-items:center;text-align:center;
  transition:transform .35s cubic-bezier(.3,.7,.3,1), filter .35s;
}
.petal::before,.hub::before{
  content:"";position:absolute;inset:-4%;border-radius:50%;
  background:radial-gradient(circle at 42% 38%, var(--c1) 0%, var(--c2) 55%, transparent 74%);
  filter:url(#wc-edge);opacity:.92;z-index:0;
}
.petal::after,.hub::after{
  content:"";position:absolute;inset:6%;border-radius:50%;
  border:1px solid rgba(255,255,255,.55);z-index:0;
}
.petal:hover,.petal:focus-visible{transform:scale(1.07)}
.petal:focus-visible,.hub:focus-visible{outline:none;filter:drop-shadow(0 0 10px rgba(169,137,77,.6))}
.petal .in,.hub .in{position:relative;z-index:1;padding:0 12%;display:flex;flex-direction:column;align-items:center;gap:2px}
.petal .num{font-family:var(--display);font-size:.78em;opacity:.65}
.petal .t{font-family:var(--display);font-weight:500;line-height:1.2;font-size:1em}
.petal .s{font-size:.72em;color:var(--ink-soft);line-height:1.3}
.hub{--c1:#fffaf0;--c2:rgba(216,185,126,.75)}
.hub .t{font-family:var(--display);font-weight:700;line-height:1.15;font-size:1.15em}
.hub .s{font-size:.75em;color:var(--ink-soft);line-height:1.35}
.hub:hover{transform:scale(1.03)}
.stem{position:absolute;inset:0;pointer-events:none}
.stem line{stroke:var(--sand-deep);stroke-width:1;stroke-dasharray:2 5;opacity:.45}

.petal-in{animation:bloom .7s cubic-bezier(.3,.8,.3,1) both}
@keyframes bloom{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* ---------- Detail (zoomed node) ---------- */
.detail{
  position:fixed;inset:0;z-index:5;overflow-y:auto;opacity:0;visibility:hidden;
  transition:opacity .45s ease, visibility 0s .45s;
}
.detail.open{opacity:1;visibility:visible;transition:opacity .45s ease}
.detail-inner{max-width:760px;margin:0 auto;padding:16px 18px 80px}
.detail-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;
  background:transparent}
.back-btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:9px 18px 9px 14px;font-weight:400;backdrop-filter:blur(6px);
}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.back-btn:hover{background:#fffaf0}
.detail-hero{position:relative;text-align:center;padding:26px 6px 14px}
.detail-hero .badge,.p-title .badge{
  width:82px;height:82px;margin:0 auto 10px;position:relative;border-radius:50%;
  display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;
}
.detail-hero .badge::before,.p-title .badge::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 42% 38%,var(--c1),var(--c2) 60%,transparent 76%);filter:url(#wc-edge)}
.detail-hero .badge span,.p-title .badge span{position:relative}
.detail-hero h2{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,5vw,2.5rem);margin:0;line-height:1.2}
.detail-hero p{margin:6px auto 0;color:var(--ink-soft);max-width:560px}

.blocks{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.block{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);backdrop-filter:blur(4px);
  animation:rise .5s ease both}
.block:nth-child(2){animation-delay:.06s}.block:nth-child(3){animation-delay:.12s}.block:nth-child(4){animation-delay:.18s}.block:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.block h3{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0 0 6px}
.block .kind{font-size:.75rem;letter-spacing:.08em;color:var(--sand-deep);margin-bottom:4px;font-weight:400}
.block p{margin:0 0 .6em;white-space:pre-line}
.block p:last-child{margin-bottom:0}
.block.quote{background:transparent;box-shadow:none;border:0;border-inline-start:3px solid var(--rose);border-radius:0;padding:6px 20px}
.block.quote blockquote{margin:0;font-family:var(--display);font-size:clamp(1.25rem,3.4vw,1.6rem);line-height:1.5}
.src{margin-top:8px;color:var(--ink-soft);font-size:.9rem}
.block.poem .poem-body{font-family:var(--display);font-size:1.15rem;white-space:pre-line;line-height:1.85}
.block.research{border-top:4px solid var(--sea)}
.block.image img{width:100%;border-radius:12px;display:block;cursor:zoom-in}
.block.image .zoom-hint{display:block;margin-top:6px;color:var(--ink-soft);font-size:.82rem}
#imgViewer{position:fixed;inset:0;z-index:200;background:rgba(15,20,20,.94);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#imgViewer.open{display:flex}
#imgViewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#imgViewer button{position:absolute;top:14px;left:14px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1d2a2a;font-size:1.4rem;cursor:pointer}
.block.image figcaption{color:var(--ink-soft);font-size:.9rem;margin-top:8px}
.b-q{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(169,137,77,.45);font-size:1.05rem}
.b-q span{display:inline-block;margin-inline-end:8px;font-size:.72rem;letter-spacing:.08em;color:#fff;background:var(--sand-deep);border-radius:999px;padding:1px 9px;vertical-align:2px}
.block.quote .b-q{border-top-color:rgba(184,116,114,.4)}
.questions .q-main li{font-size:1.2rem;font-family:var(--display);border-style:solid;background:rgba(255,252,245,.82)}
.song .listen{font-style:italic;color:var(--ink-soft);margin:8px 0 12px}
.yt{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#1d2a2a;display:grid;place-items:center;margin:6px 0 10px}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-play{display:flex;gap:8px;align-items:center;border:0;border-radius:999px;padding:12px 22px;min-height:48px;background:rgba(255,255,255,.92);color:#1d2a2a;font:inherit;font-weight:500;cursor:pointer}
.yt-play:hover{background:#fff}
.lyrics-link{display:inline-block;margin-top:4px;color:var(--sea-deep)}
/* ---------- Presentation mode ---------- */
.present-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;min-height:44px;font:inherit;color:var(--ink);cursor:pointer;backdrop-filter:blur(6px)}
.present-btn:hover{background:#fffaf0}
.present-btn svg{width:16px;height:16px;fill:var(--sea-deep)}
#present{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;background:radial-gradient(ellipse at 20% 10%,rgba(169,211,199,.35),transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(240,207,205,.4),transparent 55%),var(--paper)}
#present.open{display:flex}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px}
.p-where{color:var(--ink-soft);font-size:.95rem}
.p-stage{flex:1;overflow-y:auto;display:flex;padding:8px 18px 18px}
.p-slide{margin:auto;width:100%;max-width:980px;animation:pIn .35s ease}
@keyframes pIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.p-slide{animation:none}}
.p-title{text-align:center}
.p-title .badge{margin:0 auto 18px}
.p-title h2{font-family:var(--display);font-weight:500;font-size:clamp(2.2rem,6vw,4rem);margin:0;line-height:1.15}
.p-title p{font-size:clamp(1.15rem,2.6vw,1.6rem);color:var(--ink-soft);margin:14px 0 0}
.p-q{text-align:center}
.p-q .lbl{color:var(--sand-deep);font-size:1rem;letter-spacing:.04em;margin-bottom:18px}
.p-q .qq{font-family:var(--display);font-size:clamp(1.7rem,4.6vw,3rem);line-height:1.35;margin:0 0 18px}
.p-slide .block{font-size:clamp(1.05rem,2.1vw,1.35rem)}
.p-slide .block blockquote{font-size:clamp(1.6rem,3.8vw,2.5rem);line-height:1.35}
.p-slide .block h3{font-size:clamp(1.4rem,3vw,2rem)}
.p-slide .block.image img{max-height:62vh;object-fit:contain}
.p-read .poem-body{font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.7}
.p-slide .revealed .b-q{animation:qIn .45s ease;font-size:1.2em}
@keyframes qIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.p-slide .revealed .b-q{animation:none}}
.p-end{text-align:center}
.p-end h2{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,3.4rem);margin:0 0 10px}
.p-end p{color:var(--ink-soft);font-size:1.2rem;margin:0}
.p-bar{display:flex;align-items:center;gap:12px;padding:10px 18px calc(12px + env(safe-area-inset-bottom))}
.p-bar button{min-height:48px;min-width:48px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 20px;font:inherit;color:var(--ink);cursor:pointer}
.p-bar button:hover:not(:disabled){background:#fffaf0}
.p-bar button:disabled{opacity:.35;cursor:default}
.p-bar .p-next{background:var(--sea-deep);border-color:var(--sea-deep);color:#fff}
.p-bar .p-next:hover:not(:disabled){background:#3f7a6c}
.p-prog{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.p-prog span{display:block;height:100%;background:var(--sand);transition:width .3s}
.block.cards{border-top:4px solid var(--rose)}
.card-stage{display:flex;justify-content:center;padding:14px 0 6px;perspective:900px}
.draw-card{width:min(260px,72vw);min-height:330px;border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 14px 34px rgba(70,60,40,.18);border:1px solid rgba(255,255,255,.7)}
.draw-card.back{background:radial-gradient(circle at 35% 30%,#f0cfcd,rgba(217,165,164,.9) 45%,#a9d3c7 100%)}
.draw-card.back span{font-size:2.6rem;color:#fffaf0;opacity:.85}
.draw-card.face{background:radial-gradient(circle at 50% 0%,var(--c1,#efdcb3),#fffaf0 62%);animation:flipIn .55s ease}
.draw-card .c-t{font-family:var(--display);font-weight:500;font-size:1.7rem;line-height:1.2}
.draw-card .c-x{font-size:1.05rem;line-height:1.55;color:var(--ink)}
@keyframes flipIn{from{transform:rotateY(90deg);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.draw-card.face{animation:none}}
.draw-btn{display:flex;margin:6px auto 0;min-height:48px;padding:10px 26px;border-radius:999px;border:0;background:#9a5a58;color:#fff;font:inherit;font-weight:500;cursor:pointer}
.draw-btn:hover{background:#864c4a}
.p-slide .draw-card{width:min(340px,80vw);min-height:400px}
.p-slide .draw-card .c-t{font-size:2.2rem}
.p-slide .draw-card .c-x{font-size:1.3rem}
.block.join{border-top:4px solid var(--sand)}
.join-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:8px}
.join-qr{width:min(220px,60vw);aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:#fffaf0}
.join-info{display:flex;flex-direction:column;gap:8px;flex:1 1 200px}
.join-step{font-size:1.05rem}
.join-open{display:inline-flex;align-self:flex-start;align-items:center;min-height:44px;padding:8px 18px;border-radius:999px;background:var(--sea-deep);color:#fff;text-decoration:none}
.join-open:hover{background:#3f7a6c}
.p-slide .join-qr{width:min(320px,70vw)}
.more-btn{margin-top:10px;border:0;background:none;color:var(--sea-deep);font-weight:400;padding:0;text-decoration:underline;text-underline-offset:4px}

.questions{margin-top:26px}
.questions.first{margin-top:6px}
.blocks-title{font-family:var(--display);font-weight:500;font-size:1.1rem;text-align:center;color:var(--ink-soft);margin:30px 0 0}
.questions h3{font-family:var(--display);font-weight:500;font-size:1.35rem;text-align:center;margin:0 0 12px}
.q-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.q-list li{display:flex;gap:14px;align-items:flex-start;background:rgba(255,252,245,.6);border:1px dashed rgba(169,137,77,.45);border-radius:16px;padding:14px 18px;font-size:1.08rem}
.q-list .qn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:#fff;font-family:var(--display);font-size:.95rem}
.next-nav{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.next-nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-size:.95rem}
.next-nav button:hover{background:#fffaf0}
.next-nav button[disabled]{opacity:.35;cursor:default}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(58,52,40,.32);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:8vh 14px 14px;opacity:0;visibility:hidden;transition:opacity .25s, visibility 0s .25s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .25s}
.modal{width:min(640px,100%);max-height:80vh;overflow:auto;background:var(--paper);border-radius:20px;box-shadow:0 20px 60px rgba(40,30,20,.3);padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal-head h3{margin:0;font-family:var(--display);font-weight:500;font-size:1.3rem}
.search-input{width:100%;font:inherit;font-size:1.05rem;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#fffdf8;color:var(--ink)}
.search-input:focus{outline:2px solid var(--sea);outline-offset:1px}
.results{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.results button{width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px}
.results button:hover{background:#fffaf0}
.results .r-node{font-size:.78rem;color:var(--sand-deep)}
.results .r-text{display:block;font-size:.95rem}
.results mark{background:rgba(216,185,126,.45);color:inherit;border-radius:3px;padding:0 2px}
.empty-r{color:var(--ink-soft);text-align:center;padding:14px}
.expand-body{white-space:pre-line;font-size:1.05rem}

/* ---------- Facilitator backstage ---------- */
.backstage{
  position:fixed;top:0;bottom:0;left:0;z-index:30;width:min(400px,92vw);
  background:#2f3a36;color:#efe9dc;padding:20px 22px 40px;overflow-y:auto;
  transform:translateX(-102%);transition:transform .35s cubic-bezier(.4,.1,.2,1);
  box-shadow:12px 0 40px rgba(0,0,0,.25);font-size:.95rem;
}
.backstage.open{transform:none}
.backstage h3{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0}
.backstage h4{font-size:.78rem;letter-spacing:.1em;color:var(--sand);margin:18px 0 6px;font-weight:500}
.backstage .bs-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:12px}
.backstage .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.backstage .icon-btn svg{stroke:#efe9dc}
.backstage p{margin:0 0 .5em;white-space:pre-line}
.backstage ul{margin:0;padding-inline-start:18px}
.backstage li{margin-bottom:4px}
.sched{list-style:none;padding:0!important}
.sched li{display:flex;gap:10px;padding:6px 8px;border-radius:8px}
.sched li.cur{background:rgba(216,185,126,.18)}
.sched .tm{flex:none;min-width:56px;color:var(--sand);font-variant-numeric:tabular-nums}
.bs-node{margin-top:6px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}
.bs-node .bs-time{display:inline-block;background:var(--sand);color:#2f3a36;border-radius:999px;padding:1px 10px;font-weight:500;font-size:.85rem}
.timer{display:flex;align-items:center;gap:10px;margin-top:8px}
.timer .clock{font-variant-numeric:tabular-nums;font-size:1.6rem;font-family:var(--display)}
.timer button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;font-size:.85rem}
.bs-hint{opacity:.5;font-size:.8rem;margin-top:24px}
.bs-trigger{position:fixed;bottom:10px;left:10px;z-index:15;width:14px;height:14px;border-radius:50%;border:0;
  background:var(--sand-deep);opacity:.18;transition:opacity .2s}
.bs-trigger:hover,.bs-trigger:focus-visible{opacity:.7}

.empty-state{text-align:center;color:var(--ink-soft);margin:auto;padding:40px 20px;font-family:var(--display);font-size:1.2rem}


body.in-node .topbar{opacity:0;pointer-events:none}
/* ---------- Session picker ---------- */
.picker{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto;padding:6vh 16px 40px}
.picker .home-head{margin-bottom:28px}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pk-card{display:flex;align-items:center;gap:16px;text-align:right;border:1px solid var(--line);background:var(--card);
  backdrop-filter:blur(6px);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);transition:transform .25s}
.pk-card:hover,.pk-card:focus-visible{transform:translateY(-3px);outline:none}
.pk-card:focus-visible{box-shadow:0 0 0 3px var(--sand)}
.pk-dot{position:relative;flex:none;width:58px;height:58px;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem}
.pk-dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 42% 38%,var(--c1),var(--c2) 60%,transparent 76%);filter:url(#wc-edge)}
.pk-dot span{position:relative}
.pk-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pk-t{font-family:var(--display);font-weight:500;font-size:1.25rem;line-height:1.25}
.pk-s{color:var(--ink-soft);font-size:.92rem;line-height:1.35}
.pk-d{color:var(--sand-deep);font-size:.8rem}
.bs-switch{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:8px;padding:6px 14px;font-size:.9rem}
.bs-switch:hover{background:rgba(255,255,255,.16)}
[hidden]{display:none!important}

/* ---------- Mobile ---------- */
@media (max-width:560px){
  .topbar{padding:10px 12px 0}
  .icon-btn{width:38px;height:38px}
  .home{padding:0 8px 18px}
  .flower{max-height:none}
  .petal .s{display:none}
  .block{padding:16px 16px}
  .detail-inner{padding:10px 14px 70px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- Watercolor filters -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wc-edge" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wc-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .35 0"/>
  </filter>
</svg>

<div class="wc-canvas" aria-hidden="true">
  <div class="wash w1"></div><div class="wash w2"></div><div class="wash w3"></div>
  <div class="wash w4"></div><div class="wash w5"></div>
  <div class="grain"></div>
</div>

<div class="app">
  <div class="topbar">
    <button class="present-btn" id="presentBtn" hidden aria-label="מצב הצגה: מעבר על המפגש שקף אחר שקף"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>מצב הצגה</button>
    <button class="icon-btn" id="searchBtn" aria-label="חיפוש">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
  </div>

  <section class="picker" id="picker" hidden></section>
  <main class="home" id="home">
    <header class="home-head">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>
    <div class="flower-wrap">
      <div class="flower" id="flower" role="navigation" aria-label="נושאי המפגש"></div>
    </div>
  </main>
</div>

<section class="detail" id="detail" aria-live="polite">
  <div class="detail-inner">
    <div class="detail-bar">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        <span>חזרה לכיכר</span>
      </button>
      <button class="icon-btn" id="searchBtn2" aria-label="חיפוש">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
    </div>
    <div id="detailBody"></div>
  </div>
</section>

<!-- Search modal -->
<div class="overlay" id="searchOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="חיפוש">
    <div class="modal-head">
      <h3>חיפוש במפגש</h3>
      <button class="icon-btn close-modal" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <input class="search-input" id="searchInput" type="search" placeholder="מילה, שם, רעיון..." autocomplete="off">
    <ul class="results" id="results"></ul>
  </div>
</div>

<!-- Expand modal -->
 <section id="present" role="dialog" aria-modal="true" aria-label="מצב הצגה">
  <div class="p-top"><span class="p-where" id="pWhere"></span>
    <button class="icon-btn" id="pClose" aria-label="יציאה ממצב הצגה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="p-stage" id="pStage"></div>
  <div class="p-bar">
    <button class="p-prev" id="pPrev" aria-label="השקף הקודם">→ הקודם</button>
    <div class="p-prog" aria-hidden="true"><span id="pProg"></span></div>
    <button class="p-next" id="pNext" aria-label="השקף הבא">הבא ←</button>
  </div>
</section>
<div id="imgViewer" role="dialog" aria-modal="true" aria-label="תמונה בהגדלה"><button type="button" aria-label="סגירה">✕</button><img alt=""></div>
<div class="overlay" id="expandOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="expandTitle"></h3>
      <button class="icon-btn close-modal" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="expand-body" id="expandBody"></div>
  </div>
</div>

<!-- Facilitator backstage -->
<aside class="backstage" id="backstage" aria-hidden="true">
  <div class="bs-head">
    <h3>אחורי הקלעים</h3>
    <button class="icon-btn" id="bsClose" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="bsBody"></div>
  <div class="bs-hint">מקש M פותח וסוגר את הפאנל</div>
</aside>
<button class="bs-trigger" id="bsTrigger" aria-label="מצב מנחה"></button>

<!-- Optional offline fallback: content.js sets window.workshopLibrary (or window.workshopData) -->
<script src="content.js"></script>
<script>
(() => {
  const PALETTE = [
    ['#a9d3c7','rgba(127,181,166,.85)'],   // sea
    ['#f0cfcd','rgba(217,165,164,.85)'],   // rose
    ['#efdcb3','rgba(216,185,126,.85)'],   // sand
    ['#b9dccf','rgba(110,170,150,.8)'],
    ['#f2d9d2','rgba(205,150,148,.82)'],
    ['#ead8ae','rgba(200,170,110,.82)'],
  ];
  const ZOOM = 3.2;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const flower = $('#flower'), detail = $('#detail'), home = $('#home');
  let data = null, current = null, busy = false;

  /* ---------- Load content ---------- */
  async function loadContent() {
    try {
      const r = await fetch('content.json', {cache:'no-store'});
      if (!r.ok) throw new Error();
      return await r.json();
    } catch (_) {
      return window.workshopData || null;
    }
  }

  /* ---------- Home (flower) ---------- */
  function renderHome() {
    const m = data.meta || {};
    document.title = m.title || 'מפגש';
    $('#title').textContent = m.title || '';
    $('#subtitle').textContent = m.subtitle || '';
    const hub = data.hub || {};
    const nodes = data.nodes || [];

    let html = '<svg class="stem" id="stem"></svg>';
    html += `<button class="hub" id="hubBtn" aria-label="${esc(hub.title || 'הכיכר המרכזית')}">
      <span class="in"><span class="t">${esc(hub.title || '')}</span>${hub.subtitle ? `<span class="s">${esc(hub.subtitle)}</span>` : ''}</span></button>`;
    nodes.forEach((n, i) => {
      const [c1, c2] = n.colors || PALETTE[i % PALETTE.length];
      html += `<button class="petal petal-in" data-i="${i}" style="--c1:${c1};--c2:${c2};animation-delay:${.08*i}s" aria-label="${esc(n.title)}">
        <span class="in"><span class="num">${i+1}</span><span class="t">${esc(n.title)}</span>${n.short ? `<span class="s">${esc(n.short)}</span>` : ''}</span></button>`;
    });
    flower.innerHTML = html;
    flower.querySelectorAll('.petal').forEach(p => p.addEventListener('click', () => openNode(+p.dataset.i)));
    $('#hubBtn').addEventListener('click', () => { if (hub.blocks?.length || hub.questions?.length) openNode('hub'); });
    layout();
  }

  /* Clockwise ring, sized so the hub never covers petals */
  function layout() {
    const nodes = data?.nodes || [];
    if (!nodes.length) return;
    const W = flower.clientWidth, H = flower.clientHeight;
    const S = Math.min(W, H), cx = W/2, cy = H/2, n = nodes.length;
    const gap = S * 0.025;
    // petal size limited by both the ring and the neighbour spacing
    let nodeD = S * (n <= 6 ? 0.28 : 0.22);
    let hubD = S * 0.33;
    let R = hubD/2 + nodeD/2 + gap;
    const chord = 2 * R * Math.sin(Math.PI / n);
    if (chord < nodeD + gap) { nodeD = chord - gap; }
    const overflow = R + nodeD/2 - S/2 + 4;
    if (overflow > 0) { const k = (S/2 - 4) / (R + nodeD/2); nodeD *= k; hubD *= k; R *= k; }
    const fs = Math.max(11, Math.min(18, nodeD * 0.13));

    const hub = $('#hubBtn');
    Object.assign(hub.style, {width:hubD+'px',height:hubD+'px',left:(cx-hubD/2)+'px',top:(cy-hubD/2)+'px',fontSize:Math.max(12,Math.min(20,hubD*.12))+'px'});
    let lines = '';
    flower.querySelectorAll('.petal').forEach((p, i) => {
      const a = -Math.PI/2 + i * 2*Math.PI/n;     // starts at top, moves clockwise
      const x = cx + R*Math.cos(a), y = cy + R*Math.sin(a);
      Object.assign(p.style, {width:nodeD+'px',height:nodeD+'px',left:(x-nodeD/2)+'px',top:(y-nodeD/2)+'px',fontSize:fs+'px'});
      p.dataset.x = x - cx; p.dataset.y = y - cy;
      lines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    });
    const stem = $('#stem');
    stem.setAttribute('viewBox', `0 0 ${W} ${H}`);
    stem.innerHTML = lines;
  }

  /* ---------- Zoom in / out ---------- */
  function openNode(key, {instant=false, focusId=null} = {}) {
    if (busy) return;
    const isHub = key === 'hub';
    const node = isHub ? data.hub : data.nodes[key];
    if (!node) return;
    current = key;
    let dx = 0, dy = 0;
    if (!isHub) {
      const p = flower.querySelector(`.petal[data-i="${key}"]`);
      dx = +p.dataset.x; dy = +p.dataset.y;
    }
    renderDetail(key);
    document.body.classList.add('in-node');
    const show = () => {
      detail.classList.add('open');
      detail.scrollTop = 0;
      busy = false;
      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.animate([{boxShadow:'0 0 0 3px #d8b97e'},{boxShadow:'0 0 0 0 transparent'}],{duration:1600}); }
      } else $('#backBtn').focus({preventScroll:true});
    };
    const hash = '#' + (isHub ? 'hub' : 'node-' + (key + 1));
    if (location.hash !== hash) history.pushState(null, '', hash);
    renderBackstage();
    if (instant || detail.classList.contains('open')) {
      flower.style.transform = `translate(${-dx*ZOOM}px,${-dy*ZOOM}px) scale(${ZOOM})`;
      flower.classList.add('zoomed'); home.style.opacity = 0;
      return show();
    }
    busy = true;
    flower.style.transform = `translate(${-dx*ZOOM}px,${-dy*ZOOM}px) scale(${ZOOM})`;
    flower.classList.add('zoomed');
    home.style.opacity = 0;
    setTimeout(show, 480);
  }

  function goHome(push = true) {
    if (current === null) return;
    const from = current;
    current = null;
    detail.classList.remove('open');
    document.body.classList.remove('in-node');
    setTimeout(() => {
      flower.style.transform = '';
      flower.classList.remove('zoomed');
      home.style.opacity = 1;
      const btn = from === 'hub' ? $('#hubBtn') : flower.querySelector(`.petal[data-i="${from}"]`);
      btn?.focus({preventScroll:true});
    }, 200);
    if (push && location.hash) history.pushState(null, '', location.pathname + location.search);
    renderBackstage();
  }

  /* ---------- Detail content ---------- */
  function blockHTML(b, id) {
    const more = b.more ? `<button class="more-btn" data-more="${id}">הרחבה</button>` : '';
    const src = b.source ? `<div class="src">— ${esc(b.source)}</div>` : '';
    const kind = b.label ? `<div class="kind">${esc(b.label)}</div>` : '';
    const q = b.question ? `<div class="b-q"><span>שאלה</span>${esc(b.question)}</div>` : '';
    return blockCore(b, id, more, src, kind).replace(/<\/(div|figure)>$/, q + '</$1>');
  }
  function ytId(u) {
    if (!u) return '';
    const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || String(u).match(/^([\w-]{11})$/);
    return m ? m[1] : '';
  }
  function blockCore(b, id, more, src, kind) {
    switch (b.type) {
      case 'quote':
        return `<div class="block quote" id="${id}">${kind}<blockquote>${esc(b.text)}</blockquote>${src}${more}</div>`;
      case 'poem':
        return `<div class="block poem" id="${id}">${kind}${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<div class="poem-body">${esc(b.text)}</div>${src}${more}</div>`;
      case 'research':
        return `<div class="block research" id="${id}"><div class="kind">${esc(b.label || 'מחקר')}</div>${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<p>${esc(b.text)}</p>${src}${more}</div>`;
      case 'song': {
        const yt = ytId(b.youtube);
        const player = yt ? `<div class="yt" data-yt="${yt}"><button class="yt-play" aria-label="השמעת השיר ${esc(b.title || '')}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>השמעה</button></div>` : '';
        const lyrics = b.lyrics ? `<div class="poem-body">${esc(b.lyrics)}</div>` : '';
        const link = b.lyricsUrl ? `<a class="lyrics-link" href="${esc(b.lyricsUrl)}" target="_blank" rel="noopener">למילות השיר ↗</a>` : '';
        return `<div class="block song" id="${id}"><div class="kind">${esc(b.label || 'שיר להאזנה')}</div>${b.title ? `<h3>${esc(b.title)}</h3>` : ''}${src}${b.text ? `<p class="listen">${esc(b.text)}</p>` : ''}${player}${lyrics}${link}${more}</div>`;
      }
      case 'cards':
        return `<div class="block cards" id="${id}">${kind}${b.title ? `<h3>${esc(b.title)}</h3>` : ''}${b.text ? `<p>${esc(b.text)}</p>` : ''}
          <div class="card-stage" aria-live="polite"><div class="draw-card back" aria-hidden="true"><span>✦</span></div></div>
          <button type="button" class="draw-btn" data-draw="${id}">שליפת קלף</button>${src}${more}</div>`;
      case 'join': {
        const host = (() => { try { const u = new URL(b.url); return u.host.replace(/^www\./, '') + (b.code ? '' : u.pathname.replace(/\/$/, '')); } catch (_) { return ''; } })();
        return `<div class="block join" id="${id}"><div class="kind">${esc(b.label || 'השתתפות מהטלפון')}</div>${b.title ? `<h3>${esc(b.title)}</h3>` : ''}${b.text ? `<p>${esc(b.text)}</p>` : ''}
          <div class="join-row">${b.qr ? `<img class="join-qr" src="${esc(b.qr)}" alt="קוד QR להצטרפות">` : ''}
          <div class="join-info"><span class="join-step">סורקים את הקוד במצלמת הטלפון</span>${host ? `<span class="join-step">או נכנסים לכתובת <b dir="ltr">${esc(host)}</b>${b.code ? ` ומקלידים את הקוד <b dir="ltr">${esc(b.code)}</b>` : ''}</span>` : ''}
          <a class="join-open" href="${esc(b.url)}" target="_blank" rel="noopener">פתיחה בלשונית חדשה ↗</a></div></div>${src}${more}</div>`;
      }
      case 'image':
        return `<figure class="block image" id="${id}" style="margin:0">${kind}<img src="${esc(b.src)}" alt="${esc(b.alt || b.caption || '')}" loading="lazy" tabindex="0" role="button" aria-label="הגדלת התמונה">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}<span class="zoom-hint">לחיצה על התמונה מגדילה אותה</span>${more}</figure>`;
      default:
        return `<div class="block text" id="${id}">${kind}${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<p>${esc(b.text)}</p>${src}${more}</div>`;
    }
  }

  function bindBlockUI(root, blocks, title) {
    root.querySelectorAll('[data-more]').forEach(btn => btn.addEventListener('click', () => {
      const bi = +btn.dataset.more.split('-b').pop();
      const b = (blocks || [])[bi];
      if (b) openExpand(b.title || title, b.more);
    }));
    root.querySelectorAll('.block.image img').forEach(img => {
      const open = () => { const v = $('#imgViewer'); v.querySelector('img').src = img.src; v.querySelector('img').alt = img.alt; v.classList.add('open'); v.querySelector('button').focus(); };
      img.addEventListener('click', open);
      img.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
    root.querySelectorAll('[data-draw]').forEach(btn => {
      const bi = +btn.dataset.draw.split('-b').pop();
      const deck = (blocks || [])[bi]?.deck || [];
      let bag = [];
      btn.addEventListener('click', () => {
        if (!deck.length) return;
        if (!bag.length) bag = deck.map((_, i) => i).sort(() => Math.random() - .5);
        const c = deck[bag.pop()];
        const tints = ['#efdcb3','#a9d3c7','#f0cfcd','#b9dccf','#ead8ae','#f2d9d2'];
        const stage = btn.parentElement.querySelector('.card-stage');
        stage.innerHTML = `<div class="draw-card face" style="--c1:${tints[Math.floor(Math.random()*tints.length)]}"><div class="c-t">${esc(c.title)}</div><div class="c-x">${esc(c.text)}</div></div>`;
        btn.textContent = 'קלף נוסף';
      });
    });
    root.querySelectorAll('.yt-play').forEach(btn => btn.addEventListener('click', () => {
      const box = btn.parentElement;
      box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${box.dataset.yt}?autoplay=1&rel=0" title="נגן השיר" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    }));
  }
  function renderDetail(key) {
    const isHub = key === 'hub';
    const n = isHub ? data.hub : data.nodes[key];
    const [c1, c2] = isHub ? ['#fffaf0','rgba(216,185,126,.8)'] : (n.colors || PALETTE[key % PALETTE.length]);
    const prefix = isHub ? 'h' : 'n' + key;
    let html = `<div class="detail-hero"><div class="badge" style="--c1:${c1};--c2:${c2}"><span>${isHub ? '✦' : key + 1}</span></div>
      <h2>${esc(n.title)}</h2>${n.intro ? `<p>${esc(n.intro)}</p>` : ''}</div>`;
    const blocksHTML = `<div class="blocks">${(n.blocks || []).map((b, i) => blockHTML(b, `${prefix}-b${i}`)).join('')}</div>`;
    let qHTML = '';
    if (n.questions?.length) {
      qHTML = `<div class="questions${n.questionsFirst ? ' first' : ''}"><h3>${esc(n.questionsTitle || 'שאלות לדיון')}</h3><ol class="q-list${n.questionsFirst ? ' q-main' : ''}">${n.questions.map((q, i) =>
        `<li id="${prefix}-q${i}">${n.questions.length > 1 ? `<span class="qn">${i+1}</span>` : ''}<span>${esc(q)}</span></li>`).join('')}</ol></div>`;
    }
    if (n.blocksTitle && n.blocks?.length) {
      html += n.questionsFirst ? qHTML + `<h3 class="blocks-title">${esc(n.blocksTitle)}</h3>` + blocksHTML : blocksHTML + qHTML;
    } else html += n.questionsFirst ? qHTML + blocksHTML : blocksHTML + qHTML;
    if (!isHub) {
      const total = data.nodes.length;
      html += `<div class="next-nav">
        <button data-go="${key-1}" ${key === 0 ? 'disabled' : ''}>→ ${key > 0 ? esc(data.nodes[key-1].title) : ''}</button>
        <button data-go="${key+1}" ${key === total-1 ? 'disabled' : ''}>${key < total-1 ? esc(data.nodes[key+1].title) : ''} ←</button></div>`;
    }
    $('#detailBody').innerHTML = html;
    bindBlockUI($('#detailBody'), n.blocks, n.title);
    $('#detailBody').querySelectorAll('[data-go]').forEach(btn => btn.addEventListener('click', () => {
      const t = +btn.dataset.go;
      if (t >= 0 && t < data.nodes.length) openNode(t);
    }));
  }

  /* ---------- Modals ---------- */
  const imgViewer = $('#imgViewer');
  imgViewer.addEventListener('click', () => imgViewer.classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && imgViewer.classList.contains('open')) { e.stopImmediatePropagation(); imgViewer.classList.remove('open'); } }, true);
  function openOverlay(el) { el.classList.add('open'); }
  function closeOverlays() { document.querySelectorAll('.overlay.open').forEach(o => o.classList.remove('open')); }
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) closeOverlays(); });
    o.querySelector('.close-modal').addEventListener('click', closeOverlays);
  });
  function openExpand(title, body) {
    $('#expandTitle').textContent = title || '';
    $('#expandBody').textContent = body || '';
    openOverlay($('#expandOverlay'));
  }

  /* ---------- Search ---------- */
  let index = [];
  function buildIndex() {
    index = [];
    const add = (key, nodeTitle, id, text) => { if (text) index.push({key, nodeTitle, id, text: String(text)}); };
    const walk = (n, key) => {
      const prefix = key === 'hub' ? 'h' : 'n' + key;
      add(key, n.title, null, n.title);
      add(key, n.title, null, n.intro);
      (n.blocks || []).forEach((b, i) => add(key, n.title, `${prefix}-b${i}`, [b.title, b.text, b.source, b.more, b.caption, b.question].filter(Boolean).join(' · ')));
      (n.questions || []).forEach((q, i) => add(key, n.title, `${prefix}-q${i}`, q));
    };
    if (data.hub) walk(data.hub, 'hub');
    (data.nodes || []).forEach((n, i) => walk(n, i));
  }
  function snippet(text, q) {
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    const start = Math.max(0, i - 40), end = Math.min(text.length, i + q.length + 70);
    const pre = (start > 0 ? '…' : '') + text.slice(start, i), hit = text.slice(i, i + q.length), post = text.slice(i + q.length, end) + (end < text.length ? '…' : '');
    return `${esc(pre)}<mark>${esc(hit)}</mark>${esc(post)}`;
  }
  function runSearch() {
    const q = $('#searchInput').value.trim();
    const out = $('#results');
    if (q.length < 2) { out.innerHTML = ''; return; }
    const hits = index.filter(r => r.text.toLowerCase().includes(q.toLowerCase())).slice(0, 30);
    if (!hits.length) { out.innerHTML = '<li class="empty-r">לא נמצאו תוצאות</li>'; return; }
    out.innerHTML = hits.map((h, i) => `<li><button data-r="${i}"><span class="r-node">${esc(h.nodeTitle)}</span><span class="r-text">${snippet(h.text, q)}</span></button></li>`).join('');
    out.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      const h = hits[+b.dataset.r];
      closeOverlays();
      openNode(h.key, {focusId: h.id});
    }));
  }
  function openSearch() { openOverlay($('#searchOverlay')); setTimeout(() => $('#searchInput').focus(), 60); }
  $('#searchInput').addEventListener('input', runSearch);
  $('#searchBtn').addEventListener('click', openSearch);
  $('#searchBtn2').addEventListener('click', openSearch);

  /* ---------- Facilitator backstage ---------- */
  const bs = $('#backstage');
  let timerSec = 0, timerId = null;
  function fmt(s) { const m = Math.floor(s/60), x = s % 60; return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }
  function toggleBackstage(force) {
    const open = force ?? !bs.classList.contains('open');
    bs.classList.toggle('open', open);
    bs.setAttribute('aria-hidden', String(!open));
    if (open) renderBackstage();
  }
  function renderBackstage() {
    if (!data || !bs.classList.contains('open')) return;
    const f = data.facilitator || {};
    let html = '';
    if (f.schedule?.length) {
      html += '<h4>חלוקת זמנים</h4><ul class="sched">' + f.schedule.map(s => {
        const cur = (current !== null && current !== 'hub' && s.node === current + 1) || (current === 'hub' && s.node === 'hub');
        return `<li class="${cur ? 'cur' : ''}"><span class="tm">${esc(s.time)}</span><span>${esc(s.label)}</span></li>`;
      }).join('') + '</ul>';
    }
    if (f.goal) html += `<h4>מטרת המפגש</h4><p>${esc(f.goal)}</p>`;
    if (f.notes) html += `<h4>הערות כלליות</h4><p>${esc(f.notes)}</p>`;

    const n = current === null ? null : current === 'hub' ? data.hub : data.nodes[current];
    const nf = n?.facilitator;
    if (n) {
      html += `<h4>עכשיו על המסך</h4><div class="bs-node"><strong>${esc(n.title)}</strong>`;
      if (nf?.time) html += ` <span class="bs-time">${esc(nf.time)}</span>`;
      if (nf?.rationale) html += `<h4>רציונל פדגוגי</h4><p>${esc(nf.rationale)}</p>`;
      if (nf?.focus?.length) html += `<h4>מיקוד הדיון</h4><ul>${nf.focus.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      if (nf?.notes) html += `<h4>הערות</h4><p>${esc(nf.notes)}</p>`;
      if (!nf) html += '<p style="opacity:.6;margin-top:8px">אין הנחיות לעמוד הזה</p>';
      html += '</div>';
    }
    if (window.__libSize > 1) html += `<h4>מפגש</h4><button class="bs-switch" onclick="__switchSession()">החלפת מפגש</button>`;
    html += `<h4>שעון</h4><div class="timer"><span class="clock" id="clock">${fmt(timerSec)}</span>
      <button id="tStart">${timerId ? 'עצירה' : 'הפעלה'}</button><button id="tReset">איפוס</button></div>`;
    $('#bsBody').innerHTML = html;
    $('#tStart').onclick = () => {
      if (timerId) { clearInterval(timerId); timerId = null; }
      else timerId = setInterval(() => { timerSec++; const c = $('#clock'); if (c) c.textContent = fmt(timerSec); }, 1000);
      renderBackstage();
    };
    $('#tReset').onclick = () => { timerSec = 0; renderBackstage(); };
  }
  $('#bsTrigger').addEventListener('click', () => toggleBackstage());
  $('#bsClose').addEventListener('click', () => toggleBackstage(false));

  /* ---------- Presentation mode (linear walk-through) ---------- */
  const present = $('#present');
  let slides = [], si = 0;
  function buildSlides() {
    const out = [];
    data.nodes.forEach((n, i) => {
      out.push({node: i, kind: 'title'});
      // each question on its own step
      const q = (n.questions || []).map((_, k) => ({node: i, kind: 'q', k}));
      // each card: long read-aloud texts paragraph by paragraph, then its question revealed as a separate step
      const bl = (n.blocks || []).flatMap((b, j) => {
        const steps = [];
        const parts = b.type === 'poem' ? String(b.text || '').split(/\n\s*\n/).filter(x => x.trim()) : [];
        if (parts.length > 1) parts.forEach((_, part) => steps.push({node: i, kind: 'block', j, part, parts: parts.length}));
        else steps.push({node: i, kind: 'block', j});
        if (b.question) steps.push({node: i, kind: 'block', j, reveal: true});
        return steps;
      });
      out.push(...(n.questionsFirst === false ? [...bl, ...q] : [...q, ...bl]));
    });
    out.push({node: data.nodes.length - 1, kind: 'end'});
    return out;
  }
  function slideHTML(sl) {
    const n = data.nodes[sl.node];
    const [c1, c2] = n.colors || PALETTE[sl.node % PALETTE.length];
    if (sl.kind === 'title') return `<div class="p-title"><div class="badge" style="--c1:${c1};--c2:${c2}"><span>${sl.node + 1}</span></div><h2>${esc(n.title)}</h2>${n.intro ? `<p>${esc(n.intro)}</p>` : ''}</div>`;
    if (sl.kind === 'q') {
      const many = n.questions.length > 1;
      return `<div class="p-q"><div class="lbl">${esc(n.questionsTitle || 'שאלה לדיון')}${many ? ` · ${sl.k + 1} מתוך ${n.questions.length}` : ''}</div><p class="qq">${esc(n.questions[sl.k])}</p></div>`;
    }
    if (sl.kind === 'end') return `<div class="p-end"><h2>תודה</h2><p>${esc(data.meta?.title || '')}</p></div>`;
    const b = n.blocks[sl.j];
    if (sl.part !== undefined) {
      const parts = String(b.text).split(/\n\s*\n/).filter(x => x.trim());
      return `<div class="blocks"><div class="block poem p-read" id="p-b${sl.j}">${b.label ? `<div class="kind">${esc(b.label)} · ${sl.part + 1}/${sl.parts}</div>` : ''}${sl.part === 0 && b.title ? `<h3>${esc(b.title)}</h3>` : ''}<div class="poem-body">${esc(parts[sl.part])}</div></div></div>`;
    }
    const shown = sl.reveal ? b : Object.assign({}, b, {question: ''});
    return `<div class="blocks${sl.reveal ? ' revealed' : ''}">${blockHTML(shown, `p-b${sl.j}`)}</div>`;
  }
  function showSlide(k) {
    si = Math.max(0, Math.min(slides.length - 1, k));
    const sl = slides[si], n = data.nodes[sl.node];
    $('#pStage').innerHTML = `<div class="p-slide">${slideHTML(sl)}</div>`;
    $('#pStage').scrollTop = 0;
    $('#pWhere').textContent = sl.kind === 'end' ? 'סוף המפגש' : `${sl.node + 1}. ${n.title}`;
    $('#pProg').style.width = `${(si / (slides.length - 1)) * 100}%`;
    $('#pPrev').disabled = si === 0;
    $('#pNext').disabled = si === slides.length - 1;
    if (sl.kind === 'block') bindBlockUI($('#pStage'), n.blocks, n.title, 'p-b');
    if (current !== sl.node) { current = sl.node; renderBackstage(); }
    try { history.replaceState(null, '', location.pathname + location.search + '#present-' + (si + 1)); } catch (_) {}
  }
  function startPresent(at = 0) {
    if (!data) return;
    if (current !== null) goHome(false);
    slides = buildSlides();
    present.classList.add('open');
    showSlide(at);
    $('#pNext').focus({preventScroll:true});
  }
  function stopPresent() {
    present.classList.remove('open');
    $('#pStage').innerHTML = '';
    current = null; renderBackstage();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
    $('#presentBtn').focus({preventScroll:true});
  }
  $('#presentBtn').addEventListener('click', () => startPresent(0));
  $('#pClose').addEventListener('click', stopPresent);
  $('#pNext').addEventListener('click', () => showSlide(si + 1));
  $('#pPrev').addEventListener('click', () => showSlide(si - 1));
  document.addEventListener('keydown', e => {
    if (!present.classList.contains('open') || imgViewer.classList.contains('open')) return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') {
      if (document.querySelector('.overlay.open') || bs.classList.contains('open')) return;
      e.stopImmediatePropagation(); return stopPresent();
    }
    const next = ['ArrowLeft', 'PageDown', ' '].includes(e.key), prev = ['ArrowRight', 'PageUp'].includes(e.key);
    if ((next || prev) && !document.querySelector('.overlay.open')) {
      if (e.key === ' ' && document.activeElement?.tagName === 'BUTTON' && !document.activeElement.closest('.p-bar')) return;
      e.preventDefault(); e.stopImmediatePropagation();
      showSlide(si + (next ? 1 : -1));
    }
  }, true);
  let tx = null, ty = null;
  present.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
  present.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) showSlide(si + (dx > 0 ? 1 : -1));
    tx = ty = null;
  });

  /* ---------- Keyboard & history ---------- */
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
    if (e.key === 'Escape') {
      if (document.querySelector('.overlay.open')) return closeOverlays();
      if (bs.classList.contains('open')) return toggleBackstage(false);
      if (current !== null) return goHome();
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'KeyM') { e.preventDefault(); toggleBackstage(); }
    if (e.key === '/') { e.preventDefault(); openSearch(); }
    if (current !== null && current !== 'hub' && !document.querySelector('.overlay.open')) {
      if (e.key === 'ArrowLeft' && current < data.nodes.length - 1) openNode(current + 1);
      if (e.key === 'ArrowRight' && current > 0) openNode(current - 1);
    }
  });
  $('#backBtn').addEventListener('click', () => goHome());

  function routeFromHash(instant) {
    const h = location.hash;
    if (h === '#hub') return openNode('hub', {instant});
    const m = h.match(/^#node-(\d+)$/);
    if (m && data.nodes[+m[1] - 1]) return openNode(+m[1] - 1, {instant});
    goHome(false);
  }
  window.addEventListener('popstate', () => routeFromHash(false));

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

  /* ---------- Boot: session library ---------- */
  async function getJSON(u) { const r = await fetch(u, {cache:'no-store'}); if (!r.ok) throw new Error(u); return r.json(); }
  async function loadLibrary() {
    try { return await getJSON('sessions.json'); }
    catch (_) { return window.workshopLibrary || null; }
  }
  async function loadSession(item) {
    if (item.data) return item.data;
    try { return await getJSON(item.file); } catch (_) { return null; }
  }
  function start(d) {
    $('#picker').hidden = true;
    $('#searchBtn').hidden = false;
    home.style.display = '';
    if (!d || !Array.isArray(d.nodes)) {
      home.innerHTML = '<div class="empty-state">התוכן של המפגש עוד לא נטען</div>';
      return;
    }
    data = d;
    $('#presentBtn').hidden = false;
    renderHome();
    buildIndex();
    const pm = location.hash.match(/^#present-(\d+)$/);
    if (pm) startPresent(+pm[1] - 1);
    else if (location.hash) routeFromHash(true);
  }
  function showPicker(lib) {
    const list = lib.sessions || [];
    home.style.display = 'none';
    $('#searchBtn').hidden = true;
    const pk = $('#picker');
    pk.hidden = false;
    pk.innerHTML = `<header class="home-head"><h1>${esc(lib.title || 'בחירת מפגש')}</h1>${lib.subtitle ? `<p>${esc(lib.subtitle)}</p>` : ''}</header>
      <div class="pk-grid">${list.map((x, i) => {
        const [c1, c2] = PALETTE[i % PALETTE.length];
        return `<button class="pk-card" data-k="${i}" style="--c1:${c1};--c2:${c2}">
          <span class="pk-dot"><span>${i + 1}</span></span>
          <span class="pk-txt"><span class="pk-t">${esc(x.title)}</span>${x.subtitle ? `<span class="pk-s">${esc(x.subtitle)}</span>` : ''}${x.date ? `<span class="pk-d">${esc(x.date)}</span>` : ''}</span>
        </button>`;
      }).join('')}</div>`;
    pk.querySelectorAll('.pk-card').forEach(b => b.addEventListener('click', async () => {
      const item = list[+b.dataset.k];
      try { history.replaceState(null, '', '?s=' + encodeURIComponent(item.id)); } catch (_) {}
      start(await loadSession(item));
    }));
  }
  window.__switchSession = () => { location.href = location.pathname; };

  (async () => {
    const lib = await loadLibrary();
    const list = lib?.sessions || [];
    window.__libSize = list.length;
    if (list.length) {
      const want = new URLSearchParams(location.search).get('s');
      const hit = list.find(x => x.id === want) || (list.length === 1 ? list[0] : null);
      if (hit) return start(await loadSession(hit));
      return showPicker(lib);
    }
    // single-session fallback: content.json, then window.workshopData
    start(await loadContent());
  })();
})();
</script>
</body>
</html>
